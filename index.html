<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルな家計簿アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>家計簿</h1>
    <h2>家計簿をつけましょう</h2>
  </header>

  <main>
    <section class="entry-panel" aria-labelledby="entry-heading">
      <h2 id="entry-heading">家計簿記録の登録</h2>
      <form>
        <p>
          <label for="entry-date">日付</label>
          <input type="date" id="entry-date" name="date" required>
        </p>
        <p>
          <label for="entry-item">品目</label>
          <input type="text" id="entry-item" name="item" required>
        </p>
        <p>
          <label for="entry-type">収支区分</label>
          <select id="entry-type" name="type" required>
            <option value="expense">はいったお金</option>
            <option value="income">使ったお金</option>
          </select>
        </p>
        <p>
          <label for="entry-amount">金額（円）</label>
          <input type="number" id="entry-amount" name="amount" min="1" step="1" required>
        </p>
        <button type="submit">追加</button>
      </form>
    </section>

    <div class="display-panels">
      <section class="summary-panel" aria-labelledby="summary-heading">
        <h2 id="summary-heading">合計金額</h2>
        <p>収入合計： <output id="income-total" aria-label="収入合計">0</output>円</p>
        <p>支出合計：<output id="expense-total" aria-label="支出合計">0</output>円</p>
        <p>収支合計：<output id="balance-total" aria-label="収支合計">0</output>円</p>
      </section>

      <section class="list-panel" aria-labelledby="list-heading">
        <h2 id="list-heading">登録内容一覧</h2>
        <table>
          <thead>
            <tr>
              <th scope="col">日付</th>
              <th scope="col">品目</th>
              <th scope="col">収支区分</th>
              <th scope="col">金額</th>
            </tr>
          </thead>
          <tbody id="entry-list">
            <tr>
              <td colspan="4">登録データはありません。</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>
  <script src="index.js" defer></script>
</body>

</html>
